<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>TikTok authorization - Publicador DubScale</title>
<style>body{margin:0;background:#f6f7f9;color:#16181d;font:16px/1.6 system-ui,Arial,sans-serif}.w{max-width:640px;margin:0 auto;padding:32px 16px}
code{display:block;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:12px;word-break:break-all;margin:12px 0}</style></head>
<body><div class="w"><h1>TikTok authorization</h1>
<p>Authorization finished. Copy the code below and paste it in the Publicador DubScale console (operators only). / Autorizaci&oacute;n terminada. Copia el c&oacute;digo y p&eacute;galo en la consola del Publicador (solo operadores).</p>
<code id="c">...</code><p id="e"></p>
<p><a href="/">Publicador DubScale</a></p></div>
<script>
// Muestra el code y el error que TikTok devuelve en la URL; no envia nada a ningun servidor.
var p=new URLSearchParams(location.search);
document.getElementById('c').textContent=p.get('code')||'(no code)';
if(p.get('error'))document.getElementById('e').textContent='Error: '+p.get('error')+' '+(p.get('error_description')||'');
</script></body></html>
